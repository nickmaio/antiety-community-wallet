name: Desktop builds
on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: antiety-community-wallet

jobs:
  desktop:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-2025
            arch: x64
            platform: win
          - name: Linux x64
            runner: ubuntu-24.04
            arch: x64
            platform: linux
          - name: macOS Apple Silicon
            runner: macos-15
            arch: arm64
            platform: mac
          - name: macOS Intel
            runner: macos-15-intel
            arch: x64
            platform: mac
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            antiety-community-wallet/package-lock.json
            antiety-community-wallet/desktop/package-lock.json
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth fakeroot libgtk-3-0t64 libnss3 libasound2t64
      - name: Install dependencies
        run: npm ci && npm --prefix desktop ci
      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        run: node -e "if (process.env.GITHUB_REF_NAME !== 'v' + require('./desktop/app/package.json').version) throw Error('The release tag must match the desktop app version')"
      - name: Build and verify wallet
        run: npm test && npm run build && npm --prefix desktop run stage
      - name: Test desktop app on Linux
        if: runner.os == 'Linux'
        run: |
          node desktop/node_modules/electron/install.js
          sudo chown root:root desktop/node_modules/electron/dist/chrome-sandbox
          sudo chmod 4755 desktop/node_modules/electron/dist/chrome-sandbox
          xvfb-run -a npm --prefix desktop test
      - name: Test desktop app
        if: runner.os != 'Linux'
        run: npm --prefix desktop test
      - name: Build installers
        run: npm --prefix desktop run package -- --${{ matrix.platform }} --${{ matrix.arch }}
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          if-no-files-found: error
          path: |
            antiety-community-wallet/desktop/dist-desktop/*.exe
            antiety-community-wallet/desktop/dist-desktop/*.dmg
            antiety-community-wallet/desktop/dist-desktop/*.AppImage
            antiety-community-wallet/desktop/dist-desktop/*.deb

  draft-release:
    name: Create draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: desktop-*
          path: installers
          merge-multiple: true
      - name: Checksum and attach installers to the draft
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          (cd installers && sha256sum ./*) > installers/SHA256SUMS.txt
          if draft=$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2>/dev/null); then
            test "$draft" = true
            gh release upload "$RELEASE_TAG" installers/* --clobber
          else
            gh release create "$RELEASE_TAG" installers/* --verify-tag --draft --generate-notes
          fi
